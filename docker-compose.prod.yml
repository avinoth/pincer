# Generic, platform-agnostic production deployment.
#
# Any Docker host can run the whole stack — web, a GoodJob worker, and Postgres —
# with no platform lock-in:
#
#   RAILS_MASTER_KEY=$(cat config/master.key) \
#     docker compose -f docker-compose.prod.yml up -d --build
#
# The web container's entrypoint runs `db:prepare` (create + migrate) on boot.
# Put a TLS-terminating reverse proxy in front of the web service's published
# port; set the remaining runtime vars (SLACK_*, OPENROUTER_API_KEY, BASE_URL,
# ADMIN_*, …) from .env.example in your orchestrator or an env file.

x-app-env: &app-env
  RAILS_ENV: production
  RAILS_MASTER_KEY: ${RAILS_MASTER_KEY:?set RAILS_MASTER_KEY to the contents of config/master.key}
  POSTGRES_HOST: db
  POSTGRES_PORT: "5432"
  POSTGRES_USER: pincer
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pincer}
  PINCER_DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-pincer}

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: pincer
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pincer}
      POSTGRES_DB: pincer_production
    volumes:
      - pincer_pg_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pincer"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  web:
    build: .
    command: ["./bin/thrust", "./bin/rails", "server"]
    environment: *app-env
    ports:
      - "${WEB_PORT:-80}:80"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/up"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
    restart: unless-stopped

  worker:
    build: .
    command: ["bundle", "exec", "good_job", "start"]
    environment: *app-env
    depends_on:
      db:
        condition: service_healthy
      web:
        condition: service_healthy   # wait until web has migrated the schema
    restart: unless-stopped

volumes:
  pincer_pg_prod:
